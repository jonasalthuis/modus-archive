# pnpm 10+ reads build-script allowlists here (no longer from package.json's
# "pnpm" field). These packages have native/postinstall build steps that the
# app needs at build time — notably `sharp` for Next.js image optimization.
onlyBuiltDependencies:
  - '@firebase/util'
  - msw
  - protobufjs
  - sharp
  - unrs-resolver

# Security: force patched versions of vulnerable transitive dependencies.
overrides:
  protobufjs: ">=7.5.5"
  websocket-driver: ">=0.7.5"
  "@grpc/grpc-js": ">=1.14.5"
  nanoid: ">=3.3.12"
